[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-discovery"
version = "0.0.1"

authors = [{ name = "Andra-Denis Ionescu"}]
classifiers = [
  "Programming Language :: Python :: 3"
]

dependencies = [
    "autogluon.tabular == 0.7.0",
    "autogluon.features == 0.7.0",
    "deprecation == 2.1.0",
    "ITMO-FS == 0.3.3",
    "joblib == 1.2.0",
    "matplotlib == 3.3.4",
    "neo4j == 4.4.0",
    "notebook == 6.4.5",
    "numba",
    "numpy == 1.22.3",
    "pandas == 1.5.3",
    "polars == 0.19.12",
    "pyarrow",
    "scikit-learn == 1.2.2",
    "seaborn == 0.11.2",
    "snakecase == 1.0.1",
    "tqdm == 4.64.0",
    "typer == 0.9.0",
    "valentine == 0.1.6",
    "xxhash"
]

readme = "README.md"

requires-python = ">=3.8,<3.10"

[project.scripts]
feature-discovery-cli = "feature_discovery.cli:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.sources]
snakecase = { path = "vendor/snakecase" }

[tool.black]
line-length = 120
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | build
  | dist
)/
'''