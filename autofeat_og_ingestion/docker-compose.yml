# Neo4j server for the ingestion, derived from the upstream feature-discovery
# docker-compose (runner service removed; only the database is needed here).
# Enterprise edition is used because the graph lives in a named database
# ("lake"), which requires multi-database support. Authentication is disabled,
# matching the upstream setup, so the NEO4J_USER/NEO4J_PASS values are ignored.
services:
  neo4j:
    container_name: feature-discovery-neo4j
    image: neo4j:5.26.0-enterprise
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
      - NEO4J_dbms_security_auth__enabled=false
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes

volumes:
  neo4j-data:
